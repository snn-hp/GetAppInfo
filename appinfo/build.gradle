apply plugin: 'com.android.application'

def releaseTime() {
    return new Date().format("yyyy-MM-dd", TimeZone.getTimeZone("UTC"))
}

android {
    compileSdk rootProject.ext.compileSdk

    defaultConfig {
        minSdk rootProject.ext.minSdk
        targetSdkVersion rootProject.ext.targetSdkVersion
        applicationId "com.yumu.appinfo"
        versionCode 1
        versionName "1.1.0"
    }

    //点击「Run App」按钮时自动打包签名配置
    signingConfigs {
        debug {//debug签名配置
            keyAlias 'appinfo'//密钥标示
            keyPassword 'appinfo'//密钥密码
            storePassword 'appinfo'//签名文件密码
            storeFile file(getRootDir().getAbsolutePath() + '/jks/appinfo.jks')//签名文件路径 需要修改成自己本地的
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = '1.8'
        targetCompatibility = '1.8'
    }
    //    debug/release
    android.applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = project.name + "_${variant.buildType.name}_${variant.versionName}_${variant.versionCode}_${releaseTime()}.apk"
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "androidx.appcompat:appcompat:$rootProject.ext.appCompatVersion"
    implementation "com.google.android.material:material:$rootProject.ext.materialVersion"
    implementation "androidx.constraintlayout:constraintlayout:$rootProject.ext.constraintlayoutVersion"
    implementation "androidx.viewpager2:viewpager2:$rootProject.ext.viewpager2Version"

    implementation 'androidx.recyclerview:recyclerview:1.0.0'
    api project(path: ':FlycoTabLayout_Lib')
    api project(path: ':simplelocation')
    api project(path: ':fablibrary')
    api project(path: ':library')
    // 动态权限
    api 'pub.devrel:easypermissions:1.1.0'
    //sweetalert
    api 'com.github.f0ris.sweetalert:library:1.6.2'
    // PictureSelector
    api 'com.github.LuckSiege.PictureSelector:picture_library:v2.5.9'
    //glide
    api "com.github.bumptech.glide:glide:4.9.0"
    api 'com.ansen.shape:shape:1.2.2'
    api 'com.makeramen:roundedimageview:2.3.0'
    api 'com.github.mcxtzhang:all-base-adapter:V1.8.0'
    api 'com.camerakit:camerakit:1.0.0-beta3.11'
    api 'com.camerakit:jpegkit:0.1.0'
    api 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.3.0'
    api 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.0.0'

//    implementation 'androidx.core:core-splashscreen:1.0.0'

}
